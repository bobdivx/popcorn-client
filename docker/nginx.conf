# Configuration nginx pour le frontend Popcorn (Docker)
# - absolute_redirect off : redirections relatives pour préserver le port
#   (ex. /setup → /setup/ reste sur origin, évite http://host/setup/ sans port → ERR_CONNECTION_REFUSED)
# - try_files : SPA + chemins Astro (/setup, /dashboard, etc.)
# - SEO : le client est une application privée (client.popcornn.app comme les instances
#   auto-hébergées) : rien ne doit être indexé. En-tête X-Robots-Tag sur toutes les réponses
#   + meta robots dans Layout.astro + vrai /robots.txt (public/robots.txt, Allow: /, sans
#   Disallow : le crawl doit rester possible pour que le noindex soit vu).
#   nginx n'hérite pas des add_header du bloc server dans un location qui définit ses propres
#   add_header : l'en-tête est donc répété dans chaque location.

# PROVISOIRE (labo /car/lab) : chemin brut (non décodé, query incluse) après le préfixe /srv
map $request_uri $popcorn_srv_uri {
    "~^/srv(?<popcorn_rest>/.*)$" $popcorn_rest;
    default /;
}

server {
    listen 80;
    listen [::]:80;
    # Coolify (legacy Astro port) healthcheck / ports_exposes
    listen 4326;
    listen [::]:4326;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # robots.txt réel (public/robots.txt, crawl autorisé) au lieu du fallback SPA HTML.
    # Ne pas bloquer le crawl : sinon les moteurs ne voient jamais le noindex (en-tête + meta).
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=3600";
        try_files /robots.txt =404;
    }

    # PROVISOIRE (labo /car/lab, mode « Via proxy client ») : /srv/<chemin> → conteneur serveur
    # sur le réseau Docker du groupe (alias « server », port 3000). Résolution DNS à la requête
    # (resolver Docker) : nginx démarre même si le serveur est absent → 502 seulement sur /srv/.
    location ^~ /srv/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $popcorn_upstream "http://server:3000";
        proxy_pass $popcorn_upstream$popcorn_srv_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Popcorn-Route "client-proxy" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|m3u8|ts|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
