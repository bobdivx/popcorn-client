name: Auto-merge dev to main (after Docker success)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and Publish Frontend Docker Image
      - Build Frontend Docker (GitHub-hosted fallback)
    types:
      - completed
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-dev-to-main-client
  # Ne pas annuler un merge en cours quand un Docker cancelled/failed
  # déclenche un run "skipped" concurrent.
  cancel-in-progress: false

jobs:
  open-and-auto-merge-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT || secrets.GH_PAT || github.token }}

      - name: Create or update PR dev -> main/master
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          git fetch origin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            TARGET_BRANCH="main"
          elif git show-ref --verify --quiet refs/remotes/origin/master; then
            TARGET_BRANCH="master"
          else
            echo "Neither main nor master exists on origin."
            exit 1
          fi

          # Résoudre les conflits récurrents VERSION.json avant d'ouvrir/merger le PR.
          git checkout -B dev origin/dev
          set +e
          git merge "origin/${TARGET_BRANCH}" --no-edit
          MERGE_EXIT=$?
          set -e

          if [ "${MERGE_EXIT}" -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            if [ "${CONFLICTS}" = "VERSION.json" ]; then
              echo "Resolving VERSION.json conflict (keep highest client.version)…"
              OURS_VER="$(git show HEAD:VERSION.json | jq -r '.client.version // "0.0.0"')"
              THEIRS_VER="$(git show MERGE_HEAD:VERSION.json | jq -r '.client.version // "0.0.0"')"
              HIGHER="$(printf '%s\n%s\n' "${OURS_VER}" "${THEIRS_VER}" | sort -V | tail -n1)"
              if [ "${HIGHER}" = "${OURS_VER}" ]; then
                git show HEAD:VERSION.json > VERSION.json
              else
                git show MERGE_HEAD:VERSION.json > VERSION.json
              fi
              echo "Kept client.version=$(jq -r '.client.version' VERSION.json) (ours=${OURS_VER}, theirs=${THEIRS_VER})"
              git add VERSION.json
              git commit --no-edit -m "chore: resolve VERSION.json conflict with ${TARGET_BRANCH}"
            else
              echo "::error::Merge conflict with ${TARGET_BRANCH}: ${CONFLICTS}"
              git merge --abort || true
              exit 1
            fi
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/dev")" ]; then
            git push origin HEAD:dev
            git fetch origin
          fi

          if [ "$(git rev-parse "origin/dev")" = "$(git rev-parse "origin/${TARGET_BRANCH}")" ]; then
            echo "dev and ${TARGET_BRANCH} are already in sync."
            exit 0
          fi

          PR_NUMBER="$(gh pr list --base "${TARGET_BRANCH}" --head "dev" --state open --json number --jq '.[0].number')"
          if [ -z "${PR_NUMBER}" ]; then
            set +e
            CREATE_OUTPUT="$(gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "dev" \
              --title "chore: merge dev into ${TARGET_BRANCH}" \
              --body "Auto-generated after successful Docker workflow on dev." 2>&1)"
            CREATE_EXIT_CODE=$?
            set -e

            if [ "${CREATE_EXIT_CODE}" -ne 0 ]; then
              if echo "${CREATE_OUTPUT}" | grep -Eq "not permitted to create or approve pull requests|createPullRequest"; then
                echo "::warning::GitHub Actions token is not allowed to create PRs. Skipping auto-merge workflow."
                exit 0
              fi
              echo "${CREATE_OUTPUT}"
              exit "${CREATE_EXIT_CODE}"
            fi

            PR_NUMBER="$(gh pr list --base "${TARGET_BRANCH}" --head "dev" --state open --json number --jq '.[0].number')"
          fi

          if [ -z "${PR_NUMBER}" ]; then
            echo "Unable to find or create pull request."
            exit 1
          fi

          set +e
          AUTO_MERGE_OUTPUT="$(gh pr merge "${PR_NUMBER}" --auto --merge 2>&1)"
          AUTO_MERGE_EXIT=$?
          set -e

          if [ "${AUTO_MERGE_EXIT}" -eq 0 ]; then
            echo "Auto-merge enabled for PR #${PR_NUMBER}."
            sleep 2
            STATE="$(gh pr view "${PR_NUMBER}" --json state --jq .state 2>/dev/null || true)"
            if [ "${STATE}" = "OPEN" ]; then
              echo "PR still open after --auto; attempting direct merge…"
              gh pr merge "${PR_NUMBER}" --merge || true
            fi
          else
            if echo "${AUTO_MERGE_OUTPUT}" | grep -Eq "Auto merge is not allowed|enablePullRequestAutoMerge"; then
              echo "::warning::Repo auto-merge setting unavailable. Falling back to direct merge."
            else
              echo "${AUTO_MERGE_OUTPUT}"
            fi
            set +e
            DIRECT_MERGE_OUTPUT="$(gh pr merge "${PR_NUMBER}" --merge 2>&1)"
            DIRECT_MERGE_EXIT=$?
            set -e
            if [ "${DIRECT_MERGE_EXIT}" -eq 0 ]; then
              echo "PR #${PR_NUMBER} merged directly."
            else
              echo "${DIRECT_MERGE_OUTPUT}"
              echo "::error::Could not merge PR #${PR_NUMBER}."
              exit 1
            fi
          fi

      - name: Trigger Vercel Deploy Hook (if configured)
        if: success()
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then
            echo "Triggering Vercel deployment hook..."
            curl -X POST "$VERCEL_HOOK"
          else
            echo "No VERCEL_DEPLOY_HOOK secret found, skipping."
          fi
